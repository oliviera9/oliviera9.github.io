<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#173d36">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/mountain.jpg' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Alain Olivier home"><svg viewBox="0 0 58 36" aria-hidden="true"><path d="M2 32 22 5l12 17 7-10 15 20M15 15l7 5 5-7"/></svg><span>ALAIN OLIVIER<small>INTERNATIONAL MOUNTAIN LEADER</small></span></a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="navigation">Menu <span>＋</span></button>
    <nav id="navigation" aria-label="Main navigation"><a href="#experiences">The experiences</a><a href="#about">Your guide</a><a href="#contact" class="nav-contact">Let’s walk <span aria-hidden="true">↗</span></a></nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><a class="footer-name" href="{{ '/' | relative_url }}">Alain Olivier<span>International Mountain Leader · Dolomites, Italy</span></a><p>Good days begin outside.</p><small>© {{ 'now' | date: '%Y' }} Alain Olivier</small></footer>
</body>
</html>
